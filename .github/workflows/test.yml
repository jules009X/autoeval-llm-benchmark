name: Verify benchmark
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[corpus]'
      - run: python scripts/prepare_corpus.py
      - run: python -m autoeval validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/preview_results.py --verify-only
      - run: python scripts/preview_results.py --output site
      - run: node --check web/app.js
      - name: Baseline smoke test (no GPU or model download)
        run: python -m autoeval run --split dev --baseline
