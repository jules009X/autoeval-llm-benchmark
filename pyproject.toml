[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoeval-local"
version = "0.1.0"
description = "Reproducible local LLM evaluation on real automotive recall reports"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
corpus = ["pypdf==6.10.0"]

[project.scripts]
autoeval = "autoeval.cli:main"

[tool.setuptools]
packages = ["autoeval"]
